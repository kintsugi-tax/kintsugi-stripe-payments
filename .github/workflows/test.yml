name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # GitHub-hosted on purpose: this repo is public and `pull_request` runs fork
    # code, so it must not run on the org's self-hosted runners.
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install Poetry
        run: pipx install poetry==2.5.1
      - name: Install dependencies
        run: poetry install
      - name: Lint
        run: poetry run ruff check . && poetry run ruff format --check .
      - name: Type check
        run: poetry run pyrefly check
      - name: Test
        run: poetry run pytest
