[project]
name = "kintsugi-stripe-payments"
version = "0.1.0"
description = "Guide and reference implementation for Kintsugi tax + Stripe payments"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi[standard]~=0.136.3",
    "kintsugi-tax-platform-sdk~=0.11.0",
    "pydantic~=2.13.4",
    "pydantic-settings~=2.14.1",
    "python-dotenv~=1.2.2",
    "stripe~=15.2.0",
    "structlog~=26.1.0",
]

[tool.poetry]
package-mode = false
requires-poetry = ">=2.1"

[tool.poetry.group.dev.dependencies]
pre-commit = ">=3.4"
pyrefly = "~=1.3.2"
pytest = ">=8.0"
pytest-cov = ">=6.0"
pytest-xdist = ">=3.6"
ruff = "~=0.13.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff.lint]
# Explicit list: Ruff 0.16 widened its default rules, so extend-select alone differs by version.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C4"]

[tool.pyrefly]
project-excludes = ["**/__pycache__", "**/node_modules", "**/.*"]
python-platform = "linux"
python-version = "3.14.0"
infer-with-first-use = false
search-path = ["."]

[tool.pyrefly.errors]
missing-import = "error"
